{% extends "layout.html" %}
{% block body %}
  <!-- Applys this styling to this page specifically  -->
<style>
.section .container {
    height: auto !important;
    min-height: 0 !important;
    padding-top: 220px;
    padding-bottom: 220px;
}
.full-height {
    min-height: 0 !important;
}
</style>

<!--Code from CodePel--->

<div class="section">
    <div class="container">
        <div class="row full-height justify-content-center">
            <div class="col-12 text-center align-self-center py-5">
                <div class="section pb-5 pt-5 pt-sm-2 text-center">
                    <h6 class="mb-0 pb-3"><span>Log In </span><span>Sign Up</span></h6>
                      <input class="checkbox" type="checkbox" id="reg-log" name="reg-log" {% if show_signup %}checked{% endif %}/>
                      <label for="reg-log"></label>
                    <div class="card-3d-wrap mx-auto">
                        <div class="card-3d-wrapper">
                            <div class="card-front">
                                <div class="center-wrap">
                                    <div class="section text-center">
                                        <h4 class="mb-4 pb-3">Log In</h4>
                                        {% if login_error %}
                                           <div class="message">
                                                {{ login_error }}
                                            </div>
                                        {% endif %}
                                        <form action="{{ url_for('validate_profile') }}" method="post">
                                            <div class="form-group">
                                                <input type="email" name="logemail" class="form-style" placeholder="Your Email" id="logemail" autocomplete="off">
                                                <i class="input-icon uil uil-at"></i>
                                            </div>	
                                            <div class="form-group mt-2">
                                                <input type="password" name="logpass" class="form-style" placeholder="Your Password" id="logpass" autocomplete="off">
                                                <i class="input-icon uil uil-lock-alt"></i>
                                            </div>
                                            <button type="submit"
                                                class="btn mt-4">submit
                                            </button>
                                            <input type="hidden" name="action" value="login">
                                        </form>
                                      </div>
                                  </div>
                              </div>
                            <div class="card-back">
                                <div class="center-wrap">
                                    <div class="section text-center">
                                        <h4 class="mb-4 pb-3">Sign Up</h4>
                                        {% if signup_error %}
                                           <div class="message">
                                                {{ signup_error }}
                                            </div>
                                        {% endif %}
                                        <form action="{{ url_for('validate_profile') }}" method="post">
                                            <div class="form-group">
                                                <input type="text" name="logname" class="form-style" placeholder="Your Name" id="logname" autocomplete="off">
                                                <i class="input-icon uil uil-user"></i>
                                            </div>
                                            <div class="form-group mt-2">
                                                <input type="email" name="logemail" class="form-style" placeholder="Your Email" id="logemail" autocomplete="off">
                                                <i class="input-icon uil uil-at"></i>
                                            </div>
                                            <div class="form-group mt-2">
                                                <input type="password" name="logpass" class="form-style" placeholder="Your Password" id="logpass" autocomplete="off">
                                                <i class="input-icon uil uil-lock-alt"></i>
                                            </div>
                                                <button type="submit"
                                                    class="btn mt-4">submit
                                                </button>
                                                <input type="hidden" name="action" value="signup">
                                        </form>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
    </div>
</div>
{% endblock %}
