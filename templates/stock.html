{% extends "layout.html" %}
{% block body %}

<br> <br>

<table id="stock_table">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Quantity in stock</th>
        <th>Order price</th>
        <th>Time till expiry</th>
    </tr>
    {% for item in stock_list %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.qty }}</td>
            <td>${{ "%.2f"|format(item.price) }}</td>
            <td>{{ item.expiry_length }}</td>
        </tr>
    {% endfor %}
</table>



{% endblock %}
